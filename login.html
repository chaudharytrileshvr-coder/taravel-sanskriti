<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Travel Sanskriti AI</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css">

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- Logo -->
            <img src="logo.png" class="logo" alt="Travel Sanskriti AI">

            <h1>Welcome Back!</h1>
            <p class="subtitle">Login to Travel Sanskriti AI</p>

            <!-- Email -->
            <div class="input-box">
                <i class="ri-mail-line"></i>
                <input type="email" placeholder="Enter your email">
            </div>

            <!-- Password -->
            <div class="input-box">
                <i class="ri-lock-line"></i>
                <input type="password" placeholder="Enter your password">
            </div>

            <div class="options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <!-- Login Button -->
            <button class="login-submit">Login</button>

            <p class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </p>

            <a href="travel.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>

</body>

</html>
